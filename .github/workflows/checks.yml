name: Checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: npm run check
      - name: Unit and smoke tests
        run: npm test
      - name: Validate ZIP64 fixture
        run: unzip -t /tmp/base44-toolkit-zip64-test.zip
      - name: Validate extension manifest
        run: node -e "const m=require('./manifest.json'); if(m.manifest_version!==3||m.version!=='4.0.0') process.exit(1)"
